[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-replay-ddc"
version = "0.6.0"
description = "Optional DDC adapter for Agent Replay"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Valentyn Rukhaylo"}]
keywords = ["ai-agents", "assurance", "forensics", "provenance"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]
dependencies = ["agent-replay>=0.6.0,<0.7.0"]

[project.urls]
Homepage = "https://github.com/altrudev/Agent-Replay"
Repository = "https://github.com/altrudev/Agent-Replay"

[project.scripts]
agent-replay-ddc = "agent_replay_ddc.cli:main"
agent-replay-ddc-radial = "agent_replay_ddc.radial_runner:main"

[tool.setuptools.packages.find]
where = ["src"]

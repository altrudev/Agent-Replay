[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-replay"
version = "0.3.0"
description = "Standalone incident reconstruction for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Valentyn Rukhaylo"}]
dependencies = []

[project.scripts]
agent-replay = "agent_replay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

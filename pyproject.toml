[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-replay"
version = "0.4.2"
description = "Standalone incident reconstruction for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Valentyn Rukhaylo"}]
dependencies = []

[project.optional-dependencies]
trace = ["agentrust-trace>=0.9.1,<0.10.0"]
dev = ["pytest>=8,<10", "jsonschema>=4.23,<5"]

[project.scripts]
agent-replay = "agent_replay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

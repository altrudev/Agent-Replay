[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-replay"
version = "0.5.1"
description = "Standalone incident reconstruction for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Valentyn Rukhaylo"}]
keywords = ["ai-agents", "incident-response", "forensics", "opentelemetry", "provenance"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/altrudev/Agent-Replay"
Repository = "https://github.com/altrudev/Agent-Replay"
Issues = "https://github.com/altrudev/Agent-Replay/issues"
Changelog = "https://github.com/altrudev/Agent-Replay/blob/main/CHANGELOG.md"

[project.optional-dependencies]
trace = ["agentrust-trace==0.9.0"]
dev = ["pytest>=8,<10", "jsonschema>=4.23,<5"]

[project.scripts]
agent-replay = "agent_replay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
